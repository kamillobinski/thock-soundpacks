name: Release

on:
  push:
    branches:
      - dev
  workflow_dispatch:
    inputs:
      soundpack_paths:
        description: 'Soundpack path(s) to rebuild'
        required: true

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Build soundpack
        run: python .github/scripts/release.py
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
          SOUNDPACK_PATHS: ${{ github.event.inputs.soundpack_paths }}

      - name: Create release PR
        run: |
          RELEASES=$(cat .github/outputs/releases.json)
          COUNT=$(echo "$RELEASES" | python3 -c "import sys,json; print(len(json.load(sys.stdin)))")

          if [ "$COUNT" -eq 1 ]; then
            SOUNDPACK_PATH=$(echo "$RELEASES" | python3 -c "import sys,json; print(json.load(sys.stdin)[0]['path'])")
            BRANCH_NAME="release/$(echo $SOUNDPACK_PATH | tr '/' '-')"
            COMMIT_MSG="release($SOUNDPACK_PATH)"
            PR_TITLE="release($SOUNDPACK_PATH)"
            PR_BODY="Automated release of \`$SOUNDPACK_PATH\`."
          else
            BRANCH_NAME="release/bulk-$(date +%s)"
            COMMIT_MSG="release(bulk)"
            PR_TITLE="release(bulk)"
            PR_BODY="Automated bulk release."
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH_NAME" origin/main

          bash .github/outputs/apply.sh | xargs git add
          cp .github/outputs/manifest.json manifest.json
          git add manifest.json

          git commit -m "$COMMIT_MSG"
          git push --force origin "$BRANCH_NAME"
          gh pr create \
            --base main \
            --head "$BRANCH_NAME" \
            --title "$PR_TITLE" \
            --body "$PR_BODY"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
